<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>COMMUNITY BARBER - Reservar turno</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
		<link rel="stylesheet" href="assets/css/styles.css" />
	</head>
	<body>
		<header class="site-header bg-dark text-white py-5">
			<div class="container">
				<div class="brand-wrap">
					<img src="assets/img/barber-logo.jpeg" alt="Logo de Community Barber" class="brand-logo" />
					<h1 class="display-4 fw-bold"><i class="bi bi-scissors"></i> COMMUNITY BARBER</h1>
				</div>
				<p class="lead mt-3">Reservá tu turno de forma rápida y sencilla</p>
			</div>
		</header>

		<main class="container my-5">
			<div class="row justify-content-center justify-content-lg-end">
				<div class="col-lg-6 col-md-8 ms-lg-auto">
					<div class="card shadow-lg border-0">
						<div class="card-header bg-dark text-white text-center py-3">
							<h2 class="mb-0"><i class="bi bi-calendar-check"></i> Reservar Turno</h2>
						</div>
						<div class="card-body p-4">
							<form id="bookingForm">
								<div class="mb-3">
									<label for="name" class="form-label fw-bold"><i class="bi bi-person"></i> Nombre completo</label>
									<input id="name" name="name" type="text" class="form-control" placeholder="Juan Pérez" required />
								</div>

								<div class="mb-3">
									<label for="phone" class="form-label fw-bold"><i class="bi bi-telephone"></i> Teléfono</label>
									<input id="phone" name="phone" type="tel" class="form-control" placeholder="341-1234567" required />
								</div>

								<div class="mb-3">
									<label for="service" class="form-label fw-bold"><i class="bi bi-scissors"></i> Servicio</label>
									<select id="service" name="service" class="form-select" required>
										<option value="">Seleccioná un servicio</option>
										<option value="Corte">💇 Corte de pelo</option>
										<option value="Barba">🧔 Barba</option>
										<option value="Corte+Barba">✂️ Corte + Barba</option>
									</select>
								</div>

								<div class="mb-3">
									<label for="date" class="form-label fw-bold"><i class="bi bi-calendar3"></i> Fecha</label>
									<input id="date" name="date" type="date" class="form-control" required />
								</div>

								<div class="mb-4">
									<label for="time" class="form-label fw-bold"><i class="bi bi-clock"></i> Hora</label>
									<select id="time" name="time" class="form-select" required>
										<option value="">Seleccioná una hora</option>
									</select>
								</div>

								<div class="d-grid gap-2">
									<button type="submit" class="btn btn-dark btn-lg"><i class="bi bi-check-circle"></i> Confirmar Turno</button>
									<button type="reset" class="btn btn-outline-secondary"><i class="bi bi-arrow-counterclockwise"></i> Limpiar</button>
								</div>
							</form>
							<div id="message" class="mt-3" aria-live="polite"></div>
						</div>
					</div>

					<div class="card shadow-lg border-0 mt-4">
						<div class="card-header bg-dark text-white text-center py-3">
							<h3 class="h5 mb-0"><i class="bi bi-clock-history"></i> Horarios de atención</h3>
						</div>
						<div class="card-body p-4">
							<ul class="list-unstyled mb-0">
								<li class="d-flex justify-content-between py-1"><span class="fw-semibold">Martes a Viernes</span><span>09:00 - 20:00</span></li>
								<li class="d-flex justify-content-between py-1"><span class="fw-semibold">Sábados</span><span>09:00 - 18:00</span></li>
								<li class="d-flex justify-content-between py-1"><span class="fw-semibold">Lunes y Domingos</span><span>Cerrado</span></li>
							</ul>
						</div>
					</div>
				</div>
			</div>
		</main>

		<footer class="site-footer bg-light text-center py-4 mt-5">
			<div class="container">
				<p class="mb-0 text-muted"><i class="bi bi-shield-check"></i> Tus datos están protegidos • Sistema de reservas COMMUNITY BARBER</p>
			</div>
		</footer>

		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
		<script src="assets/js/app.js" defer></script>
	</body>
</html>
